name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: windowsBuild
            bin_path: export/release/windows/bin

          - os: ubuntu-latest
            target: linux
            artifact: linuxBuild
            bin_path: export/release/linux/bin

          - os: macos-latest
            target: mac
            artifact: macosBuild
            bin_path: export/release/macos/bin

          - os: ubuntu-latest
            target: android
            artifact: androidBuild
            bin_path: export/release/android/bin

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.os == 'Windows' && 'C:/haxelib' || '~/haxelib' }}
          key: haxelib-${{ matrix.target }}-${{ hashFiles('Project.xml') }}
          restore-keys: |
            haxelib-${{ matrix.target }}-

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK (Android)
        if: matrix.target == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libpulse-dev \
            libdbus-1-dev \
            libvorbis-dev \
            libogg-dev

      - name: Install Haxelib (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          haxelib setup C:/haxelib
          haxelib install lime 8.3.1 --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.1.2 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib run lime setup -y
          haxelib list

      - name: Install Haxelib (Linux / macOS / Android)
        if: runner.os != 'Windows'
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.3.1 --quiet
          haxelib install openfl --quiet
          haxelib install flixel 6.1.2 --quiet
          haxelib install flixel-addons 4.0.1 --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib run lime setup -y
          haxelib list

      - name: Configure Android SDK & NDK
        if: matrix.target == 'android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Create APIStuff
        run: echo "package;class APIStuff{public static var API:String = '';public static var EncKey:String = '';}" > source/APIStuff.hx

      - name: Compile (Desktop)
        if: matrix.target != 'android'
        run: haxelib run lime build ${{ matrix.target }} -release --times

      - name: Compile (Android)
        if: matrix.target == 'android'
        run: haxelib run lime build android -release -D HXCPP_COMPILE_CACHE=~/hxcpp_cache --times

      - name: Sign APK (Android)
        if: matrix.target == 'android'
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            export/release/android/bin/app/build/outputs/apk/release/app-release-unsigned.apk \
            ForeverExtended-signed.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks-pass pass:android --key-pass pass:android \
            --ks $ANDROID_HOME/debug.keystore \
            ForeverExtended-signed.apk

      - name: Upload Artifact (Desktop)
        if: matrix.target != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin_path }}
          retention-days: 14
          compression-level: 9

      - name: Upload Artifact (Android APK)
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ForeverExtended-signed.apk
          retention-days: 14
          compression-level: 9
